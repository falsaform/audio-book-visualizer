[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-visualizer"
version = "0.1.0"
description = "Turn an audiobook + ebook into AI-analyzed scenes and generated still frames."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "pydantic>=2.6.0",
    "PyYAML>=6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "tenacity>=8.2.0",
    "Jinja2>=3.1.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "pypdf>=4.0.0",
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0.0", "pydub>=0.25.1"]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
abv = "audiobook_visualizer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
